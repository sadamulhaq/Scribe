[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scribe-analysis-glossary-example"
version = "1.0.0"
description = "Example Scribe analysis filter plugin."
requires-python = ">=3.11"
dependencies = ["scribe>=0.5"]

[project.entry-points."scribe.plugins"]
analysis_glossary = "scribe_analysis_glossary.plugin:create_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe_analysis_glossary"]
